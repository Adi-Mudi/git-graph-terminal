name: CI

# P0 T4 skeleton, filled in by W11/T4. Activates once this project has a GitHub
# remote (the repository does not exist yet — escalation item, see p0-report.md).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # W11/T4 — the pty end-to-end run. D4 keeps ALL visual/PTY E2E runs remote-only,
  # so this is the only place a real pty is allocated. `tools/pty-shot.sh` drives
  # the TUI over `script(1)` and writes both the raw capture and a deterministic
  # `--dump` frame; the job then asserts the frame drew the graph at the ladder the
  # matrix TERM promises.
  pty-e2e:
    name: pty E2E (${{ matrix.term }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - term: xterm-256color
            lang: C.UTF-8
            caps: plain/256/unicode
            rung: unicode
          - term: vt100
            lang: C
            caps: plain/16/ascii
            rung: ascii
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pty tools (util-linux `script`, binutils `strings`)
        run: sudo apt-get update && sudo apt-get install -y util-linux binutils

      - name: Build
        run: cargo build

      - name: Capture the TUI over a pty
        env:
          TERM: ${{ matrix.term }}
          LANG: ${{ matrix.lang }}
        run: tools/pty-shot.sh "ci-${{ matrix.term }}"

      - name: Assert the capture drew the graph
        run: |
          set -euo pipefail
          frame="target/pty/ci-${{ matrix.term }}.frame"
          test -s "$frame"
          # MOCK=1 (pty-shot.sh default) renders the GRAPH view, whose status bar
          # prints "commits: N" (colon). "commits (" is the text-list border title
          # only, so it can never appear in this frame.
          grep -q "commits:" "$frame"
          grep -q "caps: ${{ matrix.caps }}" "$frame"
          grep -q "graph:" "$frame"

      # M4-W12 — the inline surfaces the mockup added. `--dump --mock` is
      # headless and byte-stable, so every grep here is deterministic. Each
      # glyph comes from the capability ladder, so the vt100 row asserts the
      # ASCII fallbacks rather than the box-drawing forms.
      - name: Assert the W12 inline surfaces
        run: |
          set -euo pipefail
          frame="target/pty/ci-${{ matrix.term }}.frame"

          # T1 — the tab bar.
          grep -q "1 Overview" "$frame"
          grep -q "2 Branches" "$frame"

          # T4/T7 — the uncommitted block, its summary line and its tree rows.
          grep -q "Uncommitted Changes (3)" "$frame"
          grep -q "staged 2" "$frame"
          grep -q "src/render/ui.rs" "$frame"
          grep -q "src/legacy/panel.rs" "$frame"

          if [[ "${{ matrix.rung }}" == "ascii" ]]; then
            grep -q "v Uncommitted Changes" "$frame"
            grep -q "+- M src/render/ui.rs" "$frame"
            grep -q "+ refs | HEAD -> main" "$frame"
            # No W12 surface may still be box drawing at this rung.
            if grep -q '[┌│├└─▼▶]' "$frame"; then
              echo "box drawing survived at the ASCII rung:" >&2
              grep -n '[┌│├└─▼▶]' "$frame" >&2
              exit 1
            fi
          else
            grep -q "▼ Uncommitted Changes" "$frame"
            grep -q "┌─ M src/render/ui.rs" "$frame"
            grep -q "┌ refs │ HEAD -> main" "$frame"
          fi

      # Q1 — `Enter` expands the HEAD row and paints the details pane inline.
      # `--dump` renders the collapsed frame only, so an expanded row needs a
      # real pty. This capture runs against the checkout itself (`MOCK=0`): the
      # mock fixture has no repository behind it, so `git show` there fails and
      # the pane would paint its error state instead of a loaded one.
      - name: Capture the expanded HEAD row over a pty
        env:
          TERM: ${{ matrix.term }}
          LANG: ${{ matrix.lang }}
          MOCK: "0"
          KEYS: enter
        run: tools/pty-shot.sh "ci-${{ matrix.term }}-expanded"

      - name: Assert the details pane painted inline
        run: |
          set -euo pipefail
          shot="target/pty/ci-${{ matrix.term }}-expanded.txt"
          test -s "$shot"
          grep -q "Commit Details" "$shot"
          # The right column's header and the left column's two new rows.
          grep -q "Files (" "$shot"
          grep -q "Branch:" "$shot"
          grep -q "Tags:" "$shot"
          if [[ "${{ matrix.rung }}" == "ascii" ]]; then
            grep -q "+- Commit Details" "$shot"
          else
            grep -q "├─ Commit Details" "$shot"
          fi

      - name: Upload pty artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pty-${{ matrix.term }}
          path: target/pty/

# Not wired here yet (needs the read-only reference checkout, which is not a
# submodule of this repository): the G8 parity harness.
#   cd tools/g8-dump && npm ci && npm run fixtures && npm run dump && npm run check
# Belongs into the M1 parity job once the reference is vendored/pinned in CI.
